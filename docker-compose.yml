services:
  postgres:
    image: postgres:16
    container_name: jeopardy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jeopardy
      POSTGRES_USER: jeopardy
      POSTGRES_PASSWORD: jeopardy
    ports:
      # host:container - 5433 sull'host perche' la 5432 e' spesso occupata
      # da un'installazione nativa di Postgres su Windows. Dentro alla rete
      # Docker, tra i container, resta sempre 5432 (vedi DB_URL sotto)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeopardy -d jeopardy"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: jeopardy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jeopardy
      DB_USERNAME: jeopardy
      DB_PASSWORD: jeopardy
      # Letta dal file .env (gitignored) o dall'ambiente: la chiave non va
      # mai scritta qui. Senza chiave la generazione IA risponde 503 e il
      # resto dell'app funziona
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
