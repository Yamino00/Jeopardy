name: Deploy backend su Azure

# Non parte da solo a ogni push: un deploy consuma credito e va deciso.
# Si lancia a mano dalla scheda Actions, oppure con un tag di versione.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etichetta dell immagine (default: sha del commit)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Serve a due cose: pubblicare su ghcr.io e ottenere il token OIDC con cui
  # autenticarsi ad Azure senza password memorizzate da nessuna parte.
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # L'ambiente permette di richiedere un'approvazione manuale prima del
    # deploy, dalle impostazioni del repository. Consigliato: e' l'ultimo
    # punto in cui fermare qualcosa che consuma credito.
    environment: azure
    steps:
      - uses: actions/checkout@v4

      # I test girano prima della build: un'immagine che non passa i test non
      # deve nemmeno esistere su un registro pubblico.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test del backend
        working-directory: backend
        run: mvn -B verify

      - name: Etichetta dell immagine
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "valore=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "valore=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "valore=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # `${VAR,,}` e' l'espansione bash che abbassa tutto a minuscolo: e'
      # l'unico modo, perche' le espressioni ${{ }} di GitHub non hanno una
      # funzione per farlo.
      - name: Nome dell immagine, in minuscolo
        id: img
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jeopardy-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Accesso a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'immagine e' pubblica e va bene cosi': non contiene segreti, che
      # arrivano dalle impostazioni applicative a runtime. Ma e' anche il
      # motivo per cui backend/.dockerignore esclude .env e target/.
      - name: Costruzione e push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.img.outputs.nome }}:${{ steps.tag.outputs.valore }}
            ${{ steps.img.outputs.nome }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Autenticazione senza password: la federazione OIDC va configurata una
      # volta sola (vedi docs/DEPLOY_AZURE.md). I tre segreti qui sotto sono
      # identificatori, non credenziali: da soli non aprono niente.
      - name: Accesso ad Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `containerapp update` cambia solo l'immagine: non ridistribuisce il
      # Bicep, quindi un deploy non puo' resuscitare per sbaglio impostazioni
      # che erano state cambiate a mano. Il Bicep si rilancia apposta quando
      # cambia l'infrastruttura, non a ogni rilascio.
      - name: Aggiornamento del servizio
        run: |
          az containerapp update \
            --name "ca-${{ vars.NOME_RISORSE || 'jeopardy' }}" \
            --resource-group "${{ vars.GRUPPO_RISORSE || 'rg-jeopardy' }}" \
            --image "${{ steps.img.outputs.nome }}:${{ steps.tag.outputs.valore }}"

      - name: Indirizzo del servizio
        run: |
          FQDN=$(az containerapp show \
            --name "ca-${{ vars.NOME_RISORSE || 'jeopardy' }}" \
            --resource-group "${{ vars.GRUPPO_RISORSE || 'rg-jeopardy' }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Backend aggiornato" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Immagine: \`${{ steps.tag.outputs.valore }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Indirizzo: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifica: \`powershell -ExecutionPolicy Bypass -File scripts\\verifica-deploy.ps1 -BaseUrl https://$FQDN\`" >> "$GITHUB_STEP_SUMMARY"
