spring:
  application:
    name: jeopardy-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  # Origin ammesse per le chiamate CORS dal client web (lista separata da virgole)
  cors:
    allowed-origins: "*"
  # Lingua di default per argomenti e domande
  lingua: it
  # Percorsi esclusi dall'obbligo di header X-Client-Id (lista separata da virgole)
  percorsi-pubblici: /api/salute
  dedup:
    # Similarita trigram oltre la quale un testo e considerato duplicato
    soglia-similarita: 0.6
  banca:
    # Segnalazioni oltre le quali una domanda passa a stato 'segnalata'
    soglia-segnalazioni: 3
  ia:
    # Generazioni LLM al giorno per client (le risposte servite dalla banca non contano)
    quota-giornaliera: 20
    # Domande extra chieste all'LLM oltre alle mancanti, per assorbire gli scarti
    overprovisioning: 2
    # Costo stimato per 1000 token (0 sul free tier)
    costo-per-1k-input: 0
    costo-per-1k-output: 0
    # Le chiamate sono distribuite a turno fra i provider configurati, con
    # fallback sull'altro in caso di errore: creare un tabellone fa molte
    # chiamate di fila e un solo free tier non regge
    gemini:
      endpoint: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      modello: gemini-3.5-flash
      temperature: 0.9
      # Tetto sui token di risposta: senza, un JSON troncato non e' parsabile
      max-output-tokens: 4096
    groq:
      endpoint: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      modello: openai/gpt-oss-120b
      temperature: 0.9
  tabellone:
    righe-default: 5
    punti-base-default: 200
    codice-pubblico-lunghezza: 6
    codice-modifica-lunghezza: 12
    # Testo mostrato nelle celle rimaste senza domanda dopo la deduplicazione
    placeholder-testo: Domanda da completare
  partita:
    # Giorni dopo i quali una partita non conclusa scade
    scadenza-giorni: 1
    # Cron del job di pulizia delle partite scadute
    pulizia-cron: "0 0 4 * * *"
