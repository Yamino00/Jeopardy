spring:
  application:
    name: jeopardy-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  dedup:
    soglia-similarita: 0.6
  ia:
    quota-giornaliera: 20
    costo-per-1k-input: 0
    costo-per-1k-output: 0
    gemini:
      endpoint: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      modello: gemini-2.0-flash
