spring:
  application:
    name: jeopardy-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  # Origin ammesse per le chiamate CORS dal client web (lista separata da virgole)
  cors:
    allowed-origins: "*"
  # Lingua di default per argomenti e domande
  lingua: it
  # Percorsi esclusi dall'obbligo di header X-Client-Id (lista separata da virgole).
  # Le sonde della piattaforma non mandano header applicativi: se le probe non
  # sono qui dentro rispondono 400 e il container viene dato per morto.
  percorsi-pubblici: /api/salute,/api/salute/vivo,/api/salute/pronto
  dedup:
    # Similarita trigram oltre la quale un testo e considerato duplicato
    soglia-similarita: 0.6
  banca:
    # Segnalazioni (una per dispositivo) che disattivano una domanda, cioe' la
    # portano a stato 'segnalata': smette di essere pescata per i tabelloni
    # nuovi, ma resta visibile in quelli gia' creati. La soglia e' inclusiva:
    # con 3, la terza segnalazione disattiva.
    soglia-segnalazioni: 3
  ia:
    # Generazioni LLM al giorno per client (le risposte servite dalla banca non contano)
    quota-giornaliera: 20
    # Domande extra chieste all'LLM oltre alle mancanti, per assorbire gli scarti
    overprovisioning: 2
    # Giri completi sui provider prima di arrendersi
    tentativi: 2
    # I limiti dei free tier sono al minuto: aspettare qualche secondo basta
    attesa-dopo-limite-secondi: 12
    # Tetti sulle chiamate HTTP ai provider. Il client del JDK non ne ha di
    # suoi: senza questi, una chiamata appesa non finisce mai e trascina oltre
    # il limite l'intera richiesta HTTP in ingresso
    timeout-connessione-secondi: 5
    timeout-risposta-secondi: 45
    # Budget dell'endpoint /api/generazioni, che genera una domanda per volta
    budget-richiesta-secondi: 60
    # Costo stimato per 1000 token (0 sul free tier)
    costo-per-1k-input: 0
    costo-per-1k-output: 0
    # Le chiamate sono distribuite a turno fra i provider configurati, con
    # fallback sull'altro in caso di errore: creare un tabellone fa molte
    # chiamate di fila e un solo free tier non regge
    gemini:
      endpoint: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      modello: gemini-3.5-flash
      temperature: 0.9
      # Tetto sui token di risposta: senza, un JSON troncato non e' parsabile
      max-output-tokens: 4096
    groq:
      endpoint: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      modello: openai/gpt-oss-120b
      temperature: 0.9
  tabellone:
    righe-default: 5
    punti-base-default: 200
    codice-pubblico-lunghezza: 6
    codice-modifica-lunghezza: 12
    # Tetto sull'intera creazione di un tabellone, categorie comprese. Deve
    # restare sotto il receiveTimeout del client (180s) che a sua volta sta
    # sotto il timeout dell'ingress di Azure Container Apps (240s): cosi' e'
    # sempre il server a rispondere per primo, con un errore comprensibile
    budget-creazione-secondi: 150
    # Rigenerare una cella e' una chiamata sola: serve molto meno tempo
    budget-rigenerazione-secondi: 60
    # Riferimento al format originale: una cella per tabellone vale il doppio
    # della puntata. Spegnibile qui se un giorno il progetto smette di essere
    # privato e i nomi vanno rivisti
    daily-double-abilitato: true
  partita:
    # Giorni dopo i quali una partita non conclusa scade
    scadenza-giorni: 1
    # Cron del job di pulizia delle partite scadute
    pulizia-cron: "0 0 4 * * *"
